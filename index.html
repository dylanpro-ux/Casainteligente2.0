<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Luz - Smart Home</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --on: #00d4ff; --off: #444; --bg: #121212; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 40px; border-radius: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; border: 1px solid #333; width: 280px; }
        h1 { font-size: 1.1rem; margin-bottom: 30px; color: #888; letter-spacing: 2px; }
        .btn { width: 130px; height: 130px; border-radius: 50%; border: none; cursor: pointer; font-size: 3.5rem; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; margin: 0 auto; background: #252525; box-shadow: 0 0 0px var(--on); color: var(--off); }
        .on { color: var(--on); box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); transform: scale(1.05); }
        .status { margin-top: 25px; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; color: #555; }
        .status.active { color: var(--on); }
    </style>
</head>
<body>

    <div class="card">
        <h1>CONTROL DE LUZ</h1>
        <button id="luzBtn" class="btn">⏻</button>
        <div id="estadoLabel" class="status">SINCRONIZANDO...</div>
    </div>

    <script>
        // Tus credenciales reales
        const firebaseConfig = {
            apiKey: "AIzaSyAIbpeJTM1ZfnNvcAayJy548bCA87fMyDs",
            authDomain: "casainteligente-431d1.firebaseapp.com",
            databaseURL: "https://casainteligente-431d1-default-rtdb.firebaseio.com",
            projectId: "casainteligente-431d1",
            storageBucket: "casainteligente-431d1.firebasestorage.app",
            messagingSenderId: "103363705829",
            appId: "1:103363705829:web:58c812a21747123b984d0c"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const luzRef = db.ref("luz");

        const btn = document.getElementById('luzBtn');
        const label = document.getElementById('estadoLabel');
        let estadoLocal = false;

        // Escuchar cambios en tiempo real desde Firebase
        luzRef.on('value', (snapshot) => {
            estadoLocal = snapshot.val();
            if (estadoLocal) {
                btn.classList.add('on');
                label.innerText = "ESTADO: ENCENDIDO";
                label.classList.add('active');
            } else {
                btn.classList.remove('on');
                label.innerText = "ESTADO: APAGADO";
                label.classList.remove('active');
            }
        });

        // Al tocar el botón, enviamos el cambio a la nube
        btn.onclick = () => {
            luzRef.set(!estadoLocal);
        };
    </script>
</body>
</html>
