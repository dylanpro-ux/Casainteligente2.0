<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D_Pro | Smart Control</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --cyan: #00f2ff;
            --magenta: #ff00e5;
            --bg-dark: #050505;
            --card-bg: rgba(25, 25, 25, 0.8);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 229, 0.05) 0%, transparent 40%);
            color: white;
            font-family: 'Orbitron', 'Segoe UI', sans-serif; /* Orbitron da un toque sci-fi */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal Responsive */
        .container {
            width: 90%;
            max-width: 400px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de borde brillante superior */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .logo-area span {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
            font-weight: bold;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 2rem;
            color: #fff;
            font-weight: 300;
        }

        /* Botón de Poder Futurista */
        .power-btn-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }

        .btn-outer {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 4px solid #222;
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }

        .btn-inner {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            transition: var(--transition);
            box-shadow: inset 5px 5px 10px #000, inset -5px -5px 10px #222;
        }

        /* Estados ON */
        .on .btn-outer {
            border-color: var(--cyan);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
        }

        .on .btn-inner {
            color: var(--cyan);
            text-shadow: 0 0 15px var(--cyan);
            box-shadow: inset 2px 2px 5px #000, 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .status-badge {
            margin-top: 2rem;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #333;
            transition: var(--transition);
        }

        .active-status {
            color: var(--cyan);
            border-color: var(--cyan);
            background: rgba(0, 242, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        /* Info del sistema */
        .footer-info {
            margin-top: 2rem;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #333;
            padding-top: 1.5rem;
            color: #666;
            font-size: 0.7rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Animación de pulso */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .pulse-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--cyan);
            z-index: 0;
            display: none;
        }

        .on .pulse-effect {
            display: block;
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="mainCard">
            <div class="logo-area">
                <i data-lucide="cpu" size="18" color="#00f2ff"></i>
                <span>D_PRO SYSTEM</span>
            </div>
            
            <h1>SALA PRINCIPAL</h1>

            <div class="power-btn-container" id="luzContainer">
                <div class="pulse-effect"></div>
                <button id="luzBtn" class="btn-outer">
                    <div class="btn-inner">
                        <i data-lucide="power" size="60"></i>
                    </div>
                </button>
            </div>

            <div id="estadoLabel" class="status-badge">CONECTANDO...</div>

            <div class="footer-info">
                <div class="info-item">
                    <i data-lucide="wifi" size="14"></i>
                    <span>ONLINE</span>
                </div>
                <div class="info-item">
                    <i data-lucide="shield-check" size="14"></i>
                    <span>SECURE</span>
                </div>
                <div class="info-item">
                    <i data-lucide="zap" size="14"></i>
                    <span>0.4ms</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAIbpeJTM1ZfnNvcAayJy548bCA87fMyDs",
            authDomain: "casainteligente-431d1.firebaseapp.com",
            databaseURL: "https://casainteligente-431d1-default-rtdb.firebaseio.com",
            projectId: "casainteligente-431d1",
            storageBucket: "casainteligente-431d1.firebasestorage.app",
            messagingSenderId: "103363705829",
            appId: "1:103363705829:web:58c812a21747123b984d0c"
        };

        // Inicializar
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const luzRef = db.ref("luz");

        const container = document.getElementById('luzContainer');
        const label = document.getElementById('estadoLabel');
        let estadoLocal = false;

        // Renderizar iconos
        lucide.createIcons();

        // Escuchar cambios
        luzRef.on('value', (snapshot) => {
            estadoLocal = snapshot.val();
            if (estadoLocal) {
                container.classList.add('on');
                label.innerText = "SISTEMA: ACTIVO";
                label.classList.add('active-status');
            } else {
                container.classList.remove('on');
                label.innerText = "SISTEMA: STANDBY";
                label.classList.remove('active-status');
            }
        });

        // Click con feedback táctil (vibración en móviles)
        container.onclick = () => {
            if (navigator.vibrate) navigator.vibrate(50);
            luzRef.set(!estadoLocal);
        };
    </script>
</body>
</html>
