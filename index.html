<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D_Pro | Smart Control</title>
    
    <!-- FAVICON PARA PESTAÑAS -->
    <link rel="icon" type="image/png" href="https://images.vexels.com/media/users/3/152459/isolated/preview/8dfc349472c389fa9f9275cf801e577b-icono-de-motocicleta-futurista.png">
    
    <!-- ICONO PARA ACCESO DIRECTO (Móviles/Escritorio) -->
    <link rel="apple-touch-icon" href="https://images.vexels.com/media/users/3/152459/isolated/preview/8dfc349472c389fa9f9275cf801e577b-icono-de-motocicleta-futurista.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --cyan: #00f2ff;
            --magenta: #ff00e5;
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 15, 0.9);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 255, 0.08) 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 229, 0.08) 0%, transparent 35%);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container { width: 90%; max-width: 400px; z-index: 10; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem 2rem;
            border-radius: 50px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de escaneo */
        .card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            animation: scan 4s linear infinite;
            opacity: 0.3;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .logo-area span {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: var(--cyan);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            font-weight: 700;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .power-btn-container { position: relative; display: inline-block; }

        .btn-outer {
            width: 170px; height: 170px;
            border-radius: 50%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #1a1a1a;
            transition: var(--transition);
            position: relative;
            z-index: 2;
            outline: none;
        }

        .btn-inner {
            width: 130px; height: 130px;
            border-radius: 50%;
            background: linear-gradient(145deg, #111, #050505);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: var(--transition);
            box-shadow: 10px 10px 20px #000, -5px -5px 15px #151515;
        }

        .on .btn-outer { border-color: var(--cyan); box-shadow: 0 0 50px rgba(0, 242, 255, 0.2); }
        .on .btn-inner { color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }

        .status-badge {
            margin-top: 3rem;
            padding: 10px 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1px solid #222;
            color: #666;
        }

        .active-status { color: var(--cyan); border-color: var(--cyan); background: rgba(0, 242, 255, 0.05); }

        .footer-info {
            margin-top: 2.5rem;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
            color: #444;
            font-size: 0.65rem;
        }

        .info-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }

        .pulse-effect {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--cyan);
            z-index: 1;
            opacity: 0;
        }

        .on .pulse-effect { animation: pulse 2.5s infinite; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 0.3; } 100% { transform: scale(1.4); opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo-area">
                <i data-lucide="cpu" size="20" color="#00f2ff"></i>
                <span>D_PRO</span>
            </div>
            
            <h1>SMART CONTROL</h1>

            <div class="power-btn-container" id="luzContainer">
                <div class="pulse-effect"></div>
                <button id="luzBtn" class="btn-outer">
                    <div class="btn-inner">
                        <i data-lucide="power" size="50"></i>
                    </div>
                </button>
            </div>

            <div id="estadoLabel" class="status-badge">Sincronizando...</div>

            <div class="footer-info">
                <div class="info-item">
                    <i data-lucide="wifi" size="14"></i>
                    <span>Sherlock-5G</span>
                </div>
                <div class="info-item">
                    <i data-lucide="shield-check" size="14"></i>
                    <span>SECURE</span>
                </div>
                <div class="info-item">
                    <i data-lucide="zap" size="14"></i>
                    <span>0.4ms</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIbpeJTM1ZfnNvcAayJy548bCA87fMyDs",
            authDomain: "casainteligente-431d1.firebaseapp.com",
            databaseURL: "https://casainteligente-431d1-default-rtdb.firebaseio.com",
            projectId: "casainteligente-431d1",
            storageBucket: "casainteligente-431d1.firebasestorage.app",
            messagingSenderId: "103363705829",
            appId: "1:103363705829:web:58c812a21747123b984d0c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const luzRef = db.ref("luz");

        const container = document.getElementById('luzContainer');
        const label = document.getElementById('estadoLabel');
        let estadoLocal = false;

        lucide.createIcons();

        luzRef.on('value', (snapshot) => {
            estadoLocal = snapshot.val();
            if (estadoLocal) {
                container.classList.add('on');
                label.innerText = "SISTEMA: ACTIVO";
                label.classList.add('active-status');
            } else {
                container.classList.remove('on');
                label.innerText = "SISTEMA: STANDBY";
                label.classList.remove('active-status');
            }
        });

        container.onclick = () => {
            if (navigator.vibrate) navigator.vibrate(50);
            luzRef.set(!estadoLocal);
        };
    </script>
</body>
</html>
